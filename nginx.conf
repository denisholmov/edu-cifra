server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Для SPA - все запросы направляем на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических файлов
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}